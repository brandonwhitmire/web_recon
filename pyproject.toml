[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "web-recon"
version = "0.1.0"
description = "Passive web recon and vuln-surface classifier for authorized OSCP-style labs."
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "playwright>=1.48.0",
  "beautifulsoup4>=4.12.3",
  "lxml>=5.3.0",
  "wappalyzer-python3>=0.0.10",
]

[project.scripts]
web-recon = "web_recon.cli:main"

[tool.setuptools]
py-modules = ["web_recon_heuristics"]
packages = ["web_recon"]
