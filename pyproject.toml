[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "web_recon"
version = "0.1.0"
description = "Passive web recon and vuln-surface classifier for authorized OSCP-style labs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["recon", "oscp", "security", "web"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "playwright>=1.48.0",
  "beautifulsoup4>=4.12.3",
  "lxml>=5.3.0",
  "wappalyzer-python3>=0.0.10",
]

[project.urls]
Homepage = "https://github.com/brandonwhitmire/web_recon"
Repository = "https://github.com/brandonwhitmire/web_recon"
Issues = "https://github.com/brandonwhitmire/web_recon/issues"

[project.scripts]
web_recon = "web_recon.cli:main"

[tool.setuptools]
py-modules = ["web_recon_heuristics"]
packages = ["web_recon"]
include-package-data = true

[tool.setuptools.package-data]
web_recon = ["py.typed"]
